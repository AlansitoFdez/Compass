services:
  db:
    image: pgvector/pgvector:0.8.6-pg17
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass
      POSTGRES_DB: compass
    ports:
      # Bound to the loopback interface, not 0.0.0.0. Docker writes its own firewall
      # rules, so a plainly published port stays reachable from the whole local network
      # even when the host firewall looks closed -- and these are development
      # credentials on a database anyone could then read. Compass runs on the machine of
      # whoever uses it; nothing off that machine needs to reach Postgres.
      #
      # Both loopback addresses, not just IPv4: `localhost` resolves to ::1 first on
      # Windows, and with only 127.0.0.1 published every connection paid a ~2s IPv6
      # timeout before falling back -- measured, after this line first went in with the
      # IPv4 mapping alone.
      - "127.0.0.1:5433:5432"
      - "[::1]:5433:5432"
    volumes:
      - compass_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    ports:
      # Same reasoning as Postgres above, and it matters more here: Redis has no
      # authentication configured, and it holds the ingestion checkpoints as well as the
      # queue -- a stranger on the same wifi could corrupt the high-water mark and make
      # tenders silently disappear from future runs. A password would add nothing once
      # nothing outside this machine can open a connection at all. Both loopback
      # addresses for the same reason as Postgres above.
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies migrations and exits. The three services below wait for it to
  # succeed, which is what keeps them from each running `alembic upgrade head` in parallel
  # on startup -- Alembic takes no lock of its own, so three concurrent upgrades against
  # one database is a race, not a no-op.
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://compass:compass@db:5432/compass
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    ports:
      # Loopback only, like the database ports: the API has no authentication, and Compass
      # runs on the machine of whoever uses it.
      - "127.0.0.1:8000:8000"
      - "[::1]:8000:8000"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://compass:compass@db:5432/compass
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: ./backend
    # prefork, not the --pool=solo needed on Windows: this container is Linux, where
    # fork() works and the default pool is the right one.
    command:
      ["celery", "-A", "compass.core.celery_app", "worker", "--loglevel=info"]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://compass:compass@db:5432/compass
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  beat:
    build: ./backend
    # --schedule on the mounted volume, and this is load-bearing. Beat stores each task's
    # last_run_at there; without it, every restart initialises them to "now" and a run
    # missed while the machine was off is never recovered -- it would simply wait for the
    # next 03:00. With it, beat fires the missed daily ingestion seconds after startup,
    # which is the whole reason a tool that runs on a laptop stays up to date.
    command:
      [
        "celery",
        "-A",
        "compass.core.celery_app",
        "beat",
        "--loglevel=info",
        "--schedule=/app/state/celerybeat-schedule",
      ]
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://compass:compass@db:5432/compass
      REDIS_URL: redis://redis:6379/0
    volumes:
      - compass_beat_state:/app/state
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The dashboard, so that running Compass needs Docker and nothing else. Until 5.5 this
  # was `npm run dev` on the host, which meant a development server plus a Node install
  # on top of the Docker requirement.
  dashboard:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time, and it has to be `localhost`: this
        # URL is resolved by the browser, which cannot see Docker's internal network. The
        # api service publishes its port on the host for exactly this reason.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:3000:3000"
      - "[::1]:3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  compass_db_data:
  compass_beat_state:
