[project]
name = "compass"
version = "0.1.0"
description = "Spanish public tender radar"
readme = "README.md"
authors = [
    { name = "Alan", email = "alanfdiosdado@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "httpx2>=2.10.0",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["compass"]

[tool.ruff.lint.flake8-bugbear]
# B008 prohíbe llamadas a función en valores por defecto (mutables por lo
# general) — pero `Depends(...)` es justo el patrón que exige FastAPI para
# inyección de dependencias, así que se marca explícitamente como seguro.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"
