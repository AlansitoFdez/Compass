[project]
name = "compass"
version = "0.1.0"
description = "Spanish public tender radar"
license = "MIT"
authors = [
    { name = "Alan", email = "alanfdiosdado@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "celery>=5.6.3",
    "fastapi>=0.141.1",
    "httpx2>=2.10.0",
    "langchain>=1.4.0",
    "langfuse>=4.15.2",
    "langgraph>=1.2.11",
    "pdfplumber>=0.11.10",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.3.4",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sentence-transformers>=6.0.1",
    "sqlalchemy>=2.0.51",
    # Dependencia de sentence-transformers, declarada aquí a propósito: solo una
    # dependencia directa admite `[tool.uv.sources]`, y ese es el único punto donde
    # se puede elegir la variante CPU del wheel en Linux (ver más abajo). No añade
    # nada al entorno -- ya estaba instalada como transitiva.
    "torch>=2.14.0",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    # Only `analysis/freetext_eval.py` imports it, and that script is run by hand (5.6),
    # never by the API or the worker. Here and not in `dependencies` so the image the
    # Dockerfile builds with `--no-dev` doesn't carry pandas, pyarrow and datasets: 177 MB
    # measured in the venv, most of it pyarrow, for a script no container ever runs.
    "ragas>=0.4.3",
    # Not a dependency of Compass, a constraint ragas imposes: `ragas/llms/base.py`
    # imports `langchain_community.chat_models.vertexai` at module scope, and
    # langchain-community 0.4 removed that module when it aligned with langchain 1.x. So
    # `uv add ragas` resolves cleanly and then every `import ragas` dies with
    # ModuleNotFoundError. 0.3.31 still ships it and declares no upper bound that clashes
    # with the langchain-core 1.6 the project already runs.
    "langchain-community<0.4",
]

# CI (4.6) corre en Linux, donde el `torch` de PyPI que arrastra sentence-transformers
# viene con toda la pila CUDA detrás: ~3,3 GB de instalación, de los cuales ~2,6 GB son
# wheels de NVIDIA que un runner sin GPU no llega a usar nunca. El índice CPU de PyTorch
# deja esa instalación en ~320 MB (196 MB de ellos, el propio wheel de torch). Solo para Linux: en Windows el wheel de PyPI ya es
# CPU-only, así que el entorno local de desarrollo no cambia.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["compass"]

[tool.ruff.lint.flake8-bugbear]
# B008 prohíbe llamadas a función en valores por defecto (mutables por lo
# general) — pero `Depends(...)` es justo el patrón que exige FastAPI para
# inyección de dependencias, así que se marca explícitamente como seguro.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --strict-markers: un marcador mal escrito es un error, no un marcador nuevo. Importa
# porque `real_corpus` es lo que deselecciona tests en CI (4.6) — un typo devolvería a CI
# un test que no puede pasar ahí, en silencio.
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    'real_corpus: needs the real PLACSP corpus persisted locally; deselected in CI with -m "not real_corpus", where the database only has migrations and the seeded provider',
]
